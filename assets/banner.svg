<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Dynamic Animated Graphic Elements (Positioned in Background) -->
  <g opacity="0.25">
    <!-- Sine/Yield Curve 1 -->
    <path d="M 0,220 Q 300,100 600,240 T 1200,180" fill="none" stroke="#38bdf8" stroke-width="3">
      <animate attributeName="d" 
               values="M 0,220 Q 300,100 600,240 T 1200,180;
                       M 0,200 Q 300,260 600,120 T 1200,220;
                       M 0,220 Q 300,100 600,240 T 1200,180" 
               dur="10s" repeatCount="indefinite" />
    </path>
    <!-- Sine/Yield Curve 2 -->
    <path d="M 0,160 Q 300,280 600,140 T 1200,260" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="8,6">
      <animate attributeName="d" 
               values="M 0,160 Q 300,280 600,140 T 1200,260;
                       M 0,240 Q 300,120 600,260 T 1200,150;
                       M 0,160 Q 300,280 600,140 T 1200,260" 
               dur="12s" repeatCount="indefinite" />
    </path>
    <!-- Flight Path / Jet Icon Silhouette Movement -->
    <path d="M -50,260 C 300,80 800,280 1250,60" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8">
      <animateMotion path="M -50,260 C 300,80 800,280 1250,60" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Airplane Icon Silhouette in Background Corner -->
  <g transform="translate(1020, 50) scale(1.5)" opacity="0.15" fill="#ffffff">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
  </g>

  <!-- FOREGROUND TEXT (Clean, High Contrast, Centered & Readable) -->
  <!-- Main Title -->
  <text x="600" y="135" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="44" 
        fill="url(#titleGrad)" 
        letter-spacing="1">
    Awesome Airline Revenue Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="500" 
        font-size="20" 
        fill="url(#subGrad)"
        letter-spacing="0.5">
    Curated SaaS Platforms, Dynamic Pricing Engines, EMSR Solvers &amp; Open-Source Ecosystem
  </text>

  <!-- Tagline Badges Text -->
  <text x="600" y="235" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="400" 
        font-size="14" 
        fill="#38bdf8"
        letter-spacing="1.5">
    YIELD MANAGEMENT • DEMAND FORECASTING • O&amp;D OPTIMIZATION • CONTINUOUS PRICING
  </text>
</svg>
